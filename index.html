<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D. Barry — Portfolio</title>
</head>

<body style="
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  color: #111;
  background: #fff;
">

  <main style="
    max-width: 820px;
    margin: 0 auto;
    padding: 100px 24px;
    display: grid;
    gap: 60px;
  ">

    <!-- Header -->
    <header style="display: grid; gap: 8px;">
      <h1 style="margin: 0; font-size: 17px; font-weight: 500; letter-spacing: -0.02em;">
        D. Barry
      </h1>
      <p style="margin: 0; color: #666; font-size: 14px;">
        Designer
      </p>
    </header>

    <!-- Selected Work -->
    <section style="display: grid; gap: 10px;">
      <h2 style="margin: 0; font-size: 13px; font-weight: 500; color: #999;">
        Selected Work
      </h2>

      <a href="D-Barry-Portfolio.pdf" style="
        display: inline-block;
        padding: 12px 18px;
        border: 1px solid #ff3300
        text-decoration: none;
        color: #111;
        font-size: 14px;
        width: fit-content;
      ">
        View PDF
      </a>
    </section>

    <!-- Contact -->
    <section style="display: grid; gap: 8px;">
      <h2 style="margin: 0; font-size: 13px; font-weight: 500; color: #999;">
        Contact
      </h2>

      <p style="margin: 0; font-size: 14px; color: #222;">
        <a href="mailto:dezz.barry@proton.me" style="color: #111; text-decoration: underline;">
          dezz.barry@proton.me
        </a>
      </p>
    </section>

    <!-- Footer -->
    <footer style="padding-top: 20px; border-top: 1px solid #eee;">
      <p style="margin: 0; font-size: 12px; color: #777;">
        Updated periodically.
      </p>
    </footer>

  </main>

</body>
</html>
